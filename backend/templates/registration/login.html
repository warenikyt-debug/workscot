{% extends "base.html" %}
{% block title %}Вход — WorkScout{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-briefcase-fill text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-2">Вход в WorkScout</h3>
                    <p class="text-muted">Войдите чтобы продолжить работу</p>
                </div>
                
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/register" class="text-decoration-none">Создать аккаунт</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
