{% extends "base.html" %}
{% block title %}Создать заказ — WorkScout{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-plus-circle me-2"></i>Создать заказ</h3>

<div class="card">
    <div class="card-body">
        <form action="/orders/create" method="POST">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" name="title" class="form-control" required minlength="5">
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-control" rows="5" required minlength="20"></textarea>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Категория</label>
                    <input type="text" name="category" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Навыки</label>
                    <input type="text" name="required_skills" class="form-control" placeholder="React, TypeScript">
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Бюджет от (₽)</label>
                    <input type="number" name="budget_min" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Бюджет до (₽)</label>
                    <input type="number" name="budget_max" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Формат оплаты</label>
                    <select name="payment_format" class="form-select">
                        <option value="fixed">Фиксированная</option>
                        <option value="hourly">Почасовая</option>
                        <option value="by_agreement">Договорная</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Создать заказ
            </button>
        </form>
    </div>
</div>
{% endblock %}
